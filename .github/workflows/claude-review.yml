name: claude review

# Claude reads each pull request and leaves review comments.
# It never pushes code, never approves and never merges. The job token below
# can read the code and write PR comments, and nothing else.
#
# Sign-in uses the CLAUDE_CODE_OAUTH_TOKEN repo secret, made with `claude setup-token`
# on a computer signed in to a Claude Pro or Max plan. Runs then use that plan
# instead of a billed API key. Until the secret exists, the job skips the review
# and passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip pull requests from forks. Only branches in this repo get a review.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Say why the review is skipped
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret yet, so no review ran."

      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token, limited to the permissions above, so Claude cannot push.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_fork_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            Look for bugs, broken rules from CLAUDE.md, security problems and
            anything that would break for the person using it. Skip style nits.

            Use `gh pr comment` for one summary comment.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for problems on a specific line.
            Only post GitHub comments. Do not edit files, commit, push,
            approve or merge.

            Write in plain words a grade 8 reader can follow. Lead with the
            bottom line. Never use em dashes. Use a colon only right before
            a list.
          claude_args: |
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
