name: publish

# On every push to main: run the tests, build the zip and the Grok Bot folder, publish the zip
# as the "latest" release, push the Grok Bot folder to its mirror repo, build the one-page site
# and deploy it to Cloudflare Pages. The site reads the skill files, so a new skill shows up on
# the page the moment it lands.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_GROK_TOKEN: ${{ secrets.GROKBOT_PUSH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -t . -q

      - name: Build the zip and the Grok Bot folder
        run: python build.py --adapter all --out "dist/Six20AM-Workspace-Blueprint.zip" --grok-dir dist/grokbot-blueprint

      - name: Publish the zip as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "dist/Six20AM-Workspace-Blueprint.zip" --clobber
            gh release edit latest --notes "Built from ${GITHUB_SHA::12} on $(date -u +%Y-%m-%d). This tag moves with main."
          else
            gh release create latest "dist/Six20AM-Workspace-Blueprint.zip" --title "Latest build" \
              --notes "Built from ${GITHUB_SHA::12} on $(date -u +%Y-%m-%d). This tag moves with main." --latest
          fi

      - name: Push the Grok Bot folder to the mirror repo
        # Skipped until the GROKBOT_PUSH_TOKEN secret exists: a fine-grained token with
        # contents: write on six20am/grokbot-blueprint, and nothing else. The zip still publishes above.
        if: env.HAS_GROK_TOKEN == 'true'
        env:
          GROKBOT_PUSH_TOKEN: ${{ secrets.GROKBOT_PUSH_TOKEN }}
        run: |
          set -e
          git config --global user.name "workspace-blueprint-bot"
          git config --global user.email "noreply@six20am.com"
          python build.py --adapter grok-bot --grok-dir dist/grokbot-blueprint --push

      - name: Build the site
        run: python site/build_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy the site to Cloudflare Pages
        # Skipped until the two repository secrets exist. The zip still publishes above.
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site/dist --project-name workspace-blueprint --branch main --commit-dirty=true
