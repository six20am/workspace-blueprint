name: publish

# On every push to main: run the tests, build the zip, publish it as the "latest" release,
# build the one-page site and deploy it to Cloudflare Pages. The site reads the skill files,
# so a new skill shows up on the page the moment it lands.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -t . -q

      - name: Build the zip
        run: python build.py --out "dist/Six20AM-Workspace-Blueprint.zip"

      - name: Publish the zip as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "dist/Six20AM-Workspace-Blueprint.zip" --clobber
            gh release edit latest --notes "Built from ${GITHUB_SHA::12} on $(date -u +%Y-%m-%d). This tag moves with main."
          else
            gh release create latest "dist/Six20AM-Workspace-Blueprint.zip" --title "Latest build" \
              --notes "Built from ${GITHUB_SHA::12} on $(date -u +%Y-%m-%d). This tag moves with main." --latest
          fi

      - name: Build the site
        run: python site/build_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy the site to Cloudflare Pages
        # Skipped until the two repository secrets exist. The zip still publishes above.
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site/dist --project-name workspace-blueprint --branch main --commit-dirty=true
