<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{meta}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{meta}}">
<link rel="icon" href="assets/six20am-logo-square-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
{{style}}
<style>
.intro{padding-block:var(--s5) var(--s4)}
.intro h1{max-width:18ch}
.intro>p{color:var(--fg2);font-size:18px;max-width:60ch}
.body blockquote{margin:var(--s4) 0;font:600 clamp(22px,2.4vw,28px)/1.3 var(--display);letter-spacing:-.02em;color:var(--fg);max-width:28ch}
@media (max-width:640px){.brand span{display:none}nav.menu a.go{display:inline-flex}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="index.html"><img src="assets/six20am-logo-square-128.png" alt="Six20AM" width="32" height="32"><span>Workspace Blueprint</span></a>
  <nav class="menu" aria-label="Site">
    <a class="wide" href="index.html#setup">Setup</a>
    <a href="index.html#skills">Skills</a>
    <a class="wide" href="index.html#claude-code">Claude Code</a>
    <a class="wide" href="{{repo}}">GitHub</a>
    <a class="go" href="index.html#prompt">Copy the prompt</a>
  </nav>
</header>

<main id="top">
{{content}}
</main>

<footer>
<img src="assets/six20am-logo-lockup-480.png" alt="Six20AM" width="98" height="36">
{{footer}}
<p title="{{sha}}">Page built {{date}}.</p>
</footer>
</div>
</body>
</html>
